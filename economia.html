<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adm La fabrica de la empanada</title>
    <!-- build:css css/main.css -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <!-- endbuild -->
</head>

<body>
    <!-- build:js js/main.js -->
    <script src="./javasScript/datosFicticios.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="node_modules/apexcharts/dist/apexcharts.min.js"></script>
    <script src="./javasScript/economia.js"></script>
    <!-- los datos de este script deben llenarse con los datos de la base de datos segun el año sel-->
    <!-- endbuild -->
    <div class="container-fluid navbarStyles">
        <div class="row">
            <div class="col">
                <a href="#" class="navbar-brand textMain fw-semibold">
                    <img src="./img/logo.png" alt="logo" width="60" height="60"
                        class="d-inline-block align-text-center">
                    Economía
                </a>
            </div>
            <div class="col d-flex justify-content-end align-items-center">
                <button class="btn btn-secondary textMain fw-semibold" type="button" data-bs-toggle="collapse"
                    data-bs-target="#barMenu" aria-expanded="false" aria-controls="barMenu" id="btnGeneric">
                    <i class="bi bi-list"></i> Menú
                </button>
            </div>
            <div class="col d-flex justify-content-end align-items-center navbarStyles">
                <button class="btn btn-secondary textMain fw-semibold" type="button" data-bs-toggle="modal"
                    data-bs-target="#modalAddReMovEc" id="btnGeneric">
                    <i class="bi bi-plus-square"></i> Registrar movimiento
                </button>
                
                <div class="modal fade" id="modalAddReMovEc" tabindex="-1" aria-labelledby="tituloModalReMovEc" aria-hidden="true">
                
                    <div class="modal-dialog">
                        <div class="modal-content">
                
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="tituloModalReMovEc">
                                    Registrar movimiento
                                </h1>
                
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                                </button>
                            </div>
                
                            <form id="formNuevoMovimientoEconomico">
                
                                <div class="modal-body">
                
                                    <div class="form-group">
                
                                        <!-- TIPO DE MOVIMIENTO -->
                                        <div class="row p-3">
                                            <div class="col text-center">
                
                                                <input type="radio" class="btn-check" name="tipoMovimientoEconomico" id="ReMovEntrada"
                                                    value="IN" autocomplete="off" checked>
                
                                                <label for="ReMovEntrada"
                                                    class="btn w-25 btn-outline-warning textSecondary fw-semibold">
                                                    Entrada
                                                </label>
                
                                                <input type="radio" class="btn-check" name="tipoMovimientoEconomico" id="ReMovSalida"
                                                    value="OUT" autocomplete="off">
                
                                                <label for="ReMovSalida" class="btn w-25 btn-outline-danger textSecondary fw-semibold">
                                                    Salida
                                                </label>
                
                                            </div>
                                        </div>
                
                                        <!-- CONCEPTO -->
                                        <div class="row p-3">
                                            <div class="col">
                
                                                <label for="conceptoMovimientoEconomico" class="form-label textSecondary fw-semibold">
                                                    Concepto
                                                </label>
                
                                                <select id="conceptoMovimientoEconomico" class="form-select textSecondary fw-semibold"
                                                    required>
                                                    <option value="">Seleccionar concepto</option>
                                                </select>
                
                                            </div>
                                        </div>
                
                                        <!-- FECHA Y VALOR -->
                                        <div class="row p-3">
                
                                            <div class="col">
                
                                                <label for="fechaMovimientoEconomico" class="form-label textSecondary fw-semibold">
                                                    Fecha
                                                </label>
                
                                                <input type="date" class="form-control textSecondary fw-semibold"
                                                    id="fechaMovimientoEconomico" required>
                
                                            </div>
                
                                            <div class="col">
                
                                                <label for="valorMovimientoEconomico" class="form-label textSecondary fw-semibold">
                                                    Valor
                                                </label>
                
                                                <input type="number" class="form-control textSecondary fw-semibold"
                                                    id="valorMovimientoEconomico" min="1" step="1" required>
                
                                            </div>
                
                                        </div>
                
                                    </div>
                
                                </div>
                
                                <div class="modal-footer">
                
                                    <button class="btn btn-success textMain fw-semibold btnGeneric" type="submit">
                                        Guardar movimiento
                                    </button>
                
                                    <button class="btn btn-outline-dark fw-semibold" type="button" data-bs-dismiss="modal">
                                        Cancelar
                                    </button>
                
                                </div>
                
                            </form>
                
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="container-fluid containerP ">
        <div class="row">
            <div class="col-sm-1 navbarStyles" id="barMenu">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link  textMain fw-semibold" href="./dashboard.html">
                            <i class="bi bi-boxes"></i> Resumen
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link  textMain fw-semibold" href="./pedidos.html">
                            <i class="bi bi-box2-heart"></i> Pedidos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link textMain fw-semibold" href="./clientes.html" aria-current="page">
                            <i class="bi bi-people"> Clientes</i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link textMain fw-semibold" href="./inventario.html">
                            <i class="bi bi-basket2-fill"></i> Inventario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link textMain fw-semibold" href="./cobranza.html">
                            <i class="bi bi-cash-stack"></i> Cobranza
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active textMain fw-semibold" href="#">
                            <i class="bi bi-cash-coin"></i> Economia
                        </a>
                    </li>
                </ul>
            </div>
            <div class="col-lg-11">
                <ul class="nav nav-tabs nav-tabs-g" id="tabEconomia" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link nav-link-g active" id="movimientosEc-tab" data-bs-toggle="tab"
                            data-bs-target="#movimientosEc-tab-pane" type="button" role="tab"
                            aria-controls="movimientosEc-tab-pane" aria-selected="true">Movimientos</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link nav-link-g" id="estadisticasEc-tab" data-bs-toggle="tab"
                            data-bs-target="#estadisticasEc-tab-pane" type="button" role="tab"
                            aria-controls="estadisticasEc-tab-pane" aria-selected="false">Estadisticas</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link nav-link-g" id="regConcepto-tab" data-bs-toggle="tab"
                            data-bs-target="#regConcepto-tab-pane" type="button" role="tab"
                            aria-controls="regConcepto-tab-pane" aria-selected="false">Registro de conceptos</button>
                    </li>
                </ul>
                <div class="tab-content p-4 border border-top-0 rounded-bottom " id="tabEconomiaContent">
                    <div class="tab-pane fade show active" id="movimientosEc-tab-pane" role="tabpanel" aria-labelledby="movimientosEc-tab"
                        tabindex="0">
                    
                        <div class="row">
                    
                            <div class="col paddingCard">
                                <div class="card fw-semibold text-center" id="cardDashboard">
                    
                                    <div class="card-header">
                                        Ingresos del mes
                                    </div>
                    
                                    <div class="card-body">
                                        <h2 class="textSecondary fw-semibold" id="totalIngresosMes">
                                            $0
                                        </h2>
                                    </div>
                    
                                </div>
                            </div>
                    
                            <div class="col paddingCard">
                                <div class="card fw-semibold text-center" id="cardDashboard">
                    
                                    <div class="card-header">
                                        Gastos del mes
                                    </div>
                    
                                    <div class="card-body">
                                        <h2 class="textSecondary fw-semibold" id="totalGastosMes">
                                            $0
                                        </h2>
                                    </div>
                    
                                </div>
                            </div>
                    
                        </div>
                    
                        <hr>
                    
                        <div class="row">
                            <div class="col table-responsive">
                    
                                <table class="table">
                    
                                    <thead>
                                        <tr>
                                            <th>Fecha</th>
                                            <th>Concepto</th>
                                            <th>Tipo</th>
                                            <th>Valor</th>
                                        </tr>
                                    </thead>
                    
                                    <tbody id="tablaMovimientosEconomia"></tbody>
                    
                                </table>
                    
                            </div>
                        </div>
                    
                    </div>
                    
                    <div class="tab-pane fade" id="estadisticasEc-tab-pane" role="tabpanel" aria-labelledby="estadisticasEc-tab"
                        tabindex="0">
                    
                        <div class="row">
                    
                            <div class="col">
                                <label for="anioEstadisticasEc" class="form-label textSecondary fw-semibold">
                                    Año:
                                </label>
                    
                                <select id="anioEstadisticasEc" class="form-select textSecondary fw-semibold">
                                </select>
                            </div>
                    
                            <div class="col align-self-end">
                                <button type="button" id="btnBuscarEstadisticasEc"
                                    class="btn btn-secondary textMain fw-semibold btnGeneric">
                                    <i class="bi bi-search"></i> Buscar
                                </button>
                            </div>
                    
                        </div>
                    
                        <hr>
                    
                        <div class="row">
                            <div class="col table-responsive">
                    
                                <table class="table">
                    
                                    <thead>
                                        <tr>
                                            <th>Concepto</th>
                                            <th>Tipo</th>
                                            <th>Total del año</th>
                                        </tr>
                                    </thead>
                    
                                    <tbody id="tablaEstadisticasEc"></tbody>
                    
                                </table>
                    
                            </div>
                        </div>
                    
                        <hr>
                    
                        <div class="row">
                            <div class="col">
                                <div id="estEco"></div>
                            </div>
                        </div>
                    
                    </div>
                    
                    <div class="tab-pane fade" id="regConcepto-tab-pane" role="tabpanel" aria-labelledby="regConcepto-tab" tabindex="0">
                    
                        <!-- BUSCADOR Y BOTÓN AGREGAR -->
                        <div class="row">
                            <div class="col">
                                <button class="btn btn-secondary textMain fw-semibold btnGeneric" type="button" data-bs-toggle="modal"
                                    data-bs-target="#modalAddConcepto">
                                    <i class="bi bi-plus-square"></i> Agregar concepto
                                </button>
                            </div>
                    
                            <div class="col-lg-10">
                                <input type="search" id="buscarConcepto" class="form-control textSecondary fw-semibold"
                                    placeholder="Buscar concepto">
                            </div>
                        </div>
                        <hr>
                        <!-- TABLA DE CONCEPTOS -->
                        <div class="row p-2">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th scope="col">Nombre del concepto</th>
                                            <th scope="col">Valor</th>
                                            <th scope="col">Tipo</th>
                                            <th scope="col">Estado</th>
                                            <th scope="col">
                                                <i class="bi bi-gear"></i>
                                            </th>
                                        </tr>
                                    </thead>
                    
                                    <tbody id="tablaConceptos">
                                        <!-- Datos generados desde JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    
                        <!-- ================================================= -->
                        <!-- MODAL AGREGAR CONCEPTO -->
                        <!-- ================================================= -->
                    
                        <div class="modal fade" id="modalAddConcepto" tabindex="-1" aria-labelledby="tituloAddConcepto" aria-hidden="true">
                    
                            <div class="modal-dialog">
                                <div class="modal-content">
                    
                                    <form id="formAddConcepto">
                    
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="tituloAddConcepto">
                                                Nuevo concepto
                                            </h1>
                    
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                    
                                        <div class="modal-body">
                    
                                            <div class="row p-2">
                    
                                                <div class="col-12 mb-3">
                                                    <label for="nombreNuevoConcepto" class="form-label textSecondary fw-semibold">
                                                        Nombre
                                                    </label>
                    
                                                    <input type="text" id="nombreNuevoConcepto" class="form-control" required>
                                                </div>
                    
                                                <div class="col-6 mb-3">
                                                    <label for="tipoNuevoConcepto" class="form-label textSecondary fw-semibold">
                                                        Tipo
                                                    </label>
                    
                                                    <select id="tipoNuevoConcepto" class="form-select textSecondary fw-semibold" required>
                                                        <option value="">Seleccionar</option>
                                                        <option value="IN">Ingreso</option>
                                                        <option value="OUT">Egreso</option>
                                                    </select>
                                                </div>
                    
                                                <div class="col-6 mb-3">
                                                    <label for="valorNuevoConcepto" class="form-label textSecondary fw-semibold">
                                                        Valor
                                                    </label>
                    
                                                    <input type="number" id="valorNuevoConcepto" class="form-control" min="0" step="1"
                                                        required>
                                                </div>
                    
                                                <div class="col-12">
                                                    <div class="form-floating">
                                                        <textarea class="form-control textSecondary fw-semibold" placeholder="Descripción"
                                                            id="descripcionNuevoConcepto" style="height: 100px"></textarea>
                    
                                                        <label for="descripcionNuevoConcepto" class="textSecondary fw-semibold">
                                                            Descripción concepto
                                                        </label>
                                                    </div>
                                                </div>
                    
                                            </div>
                                        </div>
                    
                                        <div class="modal-footer">
                    
                                            <button class="btn btn-success textMain fw-semibold" type="submit">
                                                Guardar concepto
                                            </button>
                    
                                            <button class="btn btn-outline-dark fw-semibold" type="button" data-bs-dismiss="modal">
                                                Cancelar
                                            </button>
                    
                                        </div>
                    
                                    </form>
                    
                                </div>
                            </div>
                        </div>
                    
                    
                        <!-- ================================================= -->
                        <!-- MODAL ACTUALIZAR CONCEPTO -->
                        <!-- ================================================= -->
                    
                        <div class="modal fade" id="modalEditConcepto" tabindex="-1" aria-labelledby="tituloEditConcepto"
                            aria-hidden="true">
                    
                            <div class="modal-dialog">
                                <div class="modal-content">
                    
                                    <form id="formEditConcepto">
                    
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="tituloEditConcepto">
                                                Actualizar concepto
                                            </h1>
                    
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                    
                                        <div class="modal-body">
                    
                                            <input type="hidden" id="idEditConcepto">
                    
                                            <div class="row p-2">
                    
                                                <div class="col-12 mb-3">
                                                    <label for="nombreEditConcepto" class="form-label textSecondary fw-semibold">
                                                        Nombre
                                                    </label>
                    
                                                    <input type="text" id="nombreEditConcepto" class="form-control" required>
                                                </div>
                    
                                                <div class="col-6 mb-3">
                                                    <label for="tipoEditConcepto" class="form-label textSecondary fw-semibold">
                                                        Tipo
                                                    </label>
                    
                                                    <select id="tipoEditConcepto" class="form-select textSecondary fw-semibold" required>
                                                        <option value="IN">Ingreso</option>
                                                        <option value="OUT">Egreso</option>
                                                    </select>
                                                </div>
                    
                                                <div class="col-6 mb-3">
                                                    <label for="valorEditConcepto" class="form-label textSecondary fw-semibold">
                                                        Valor
                                                    </label>
                    
                                                    <input type="number" id="valorEditConcepto" class="form-control" min="0" step="1"
                                                        required>
                                                </div>
                    
                                                <div class="col-12 mb-3">
                                                    <label for="estadoEditConcepto" class="form-label textSecondary fw-semibold">
                                                        Estado
                                                    </label>
                    
                                                    <select id="estadoEditConcepto" class="form-select textSecondary fw-semibold">
                                                        <option value="AC">Activo</option>
                                                        <option value="IN">Inactivo</option>
                                                    </select>
                                                </div>
                    
                                                <div class="col-12">
                                                    <div class="form-floating">
                                                        <textarea class="form-control textSecondary fw-semibold" placeholder="Descripción"
                                                            id="descripcionEditConcepto" style="height: 100px"></textarea>
                    
                                                        <label for="descripcionEditConcepto" class="textSecondary fw-semibold">
                                                            Descripción concepto
                                                        </label>
                                                    </div>
                                                </div>
                    
                                            </div>
                                        </div>
                    
                                        <div class="modal-footer">
                    
                                            <button class="btn btn-success textMain fw-semibold" type="submit">
                                                Actualizar concepto
                                            </button>
                    
                                            <button class="btn btn-outline-dark fw-semibold" type="button" data-bs-dismiss="modal">
                                                Cancelar
                                            </button>
                    
                                        </div>
                    
                                    </form>
                    
                                </div>
                            </div>
                        </div>
                    
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
