<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adm La fabrica de la empanada</title>
    <!-- build:css css/main.css -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <!-- endbuild -->
</head>

<body>
    <!-- build:js js/main.js -->
    <script src="./javasScript/datosFicticios.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="node_modules/apexcharts/dist/apexcharts.min.js"></script>
    <script src="./javasScript/clientes.js"></script>
    <!-- los datos de este script deben llenarse con los datos de la base de datos segun el año sel-->
    <!-- endbuild -->
    <div class="container-fluid navbarStyles">
        <div class="row">
            <div class="col">
                <a href="#" class="navbar-brand textMain fw-semibold">
                    <img src="./img/logo.png" alt="logo" width="60" height="60"
                        class="d-inline-block align-text-center">
                    Clientes
                </a>
            </div>
            <div class="col d-flex justify-content-end align-items-center">
                <button class="btn btn-secondary textMain fw-semibold" type="button" data-bs-toggle="collapse"
                    data-bs-target="#barMenu" aria-expanded="false" aria-controls="barMenu" id="btnGeneric">
                    <i class="bi bi-list"></i> Menú
                </button>
            </div>
            <div class="col d-flex justify-content-end align-items-center navbarStyles">
                <button class="btn btn-secondary textMain fw-semibold" type="button" data-bs-toggle="modal"
                    data-bs-target="#modalAddCliente" id="btnGeneric">
                    <i class="bi bi-plus-square"></i> Cliente
                </button>
                <div class="modal fade" id="modalAddCliente" tabindex="-1" aria-labelledby="modalAddCliente"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="modalAddCliente"> Nuevo cliente</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form action="">
                                    <div class="form-group">
                                        <div class="row p-3">
                                            <div class="col">
                                                <label for="" class="form-label textSecondary fw-semibold">Nombre
                                                    cliente</label>
                                                <input type="text" class="form-control w-75">
                                            </div>

                                            
                                        </div>
                                        <div class="row p-3">
                                            <div class="col">
                                                <label for=""
                                                    class="form-label textSecondary fw-semibold">Celular</label>
                                                <input type="text" class="form-control w-75" id="">
                                            </div>
                                        </div>
                                        <div class="row p-3">
                                            <div class="col">
                                                <label for="" class="form-label textSecondary fw-semibold">Direccion</label>
                                                <input type="text" class="form-control w-75" id="">
                                            </div>
                                        </div>
                                    </div>
                                </form>                     
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-success textMain fw-semibold btnGeneric" type="button">Guardar cliente</button>
                                <button class="btn btn-outline-dark fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid containerP ">
        <div class="row">
            <div class="col-sm-1 navbarStyles" id="barMenu">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link  textMain fw-semibold" href="./dashboard.html">
                            <i class="bi bi-boxes"></i> Resumen
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link  textMain fw-semibold" href="./pedidos.html">
                            <i class="bi bi-box2-heart"></i> Pedidos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active textMain fw-semibold" href="#" aria-current="page">
                            <i class="bi bi-people"> Clientes</i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link textMain fw-semibold" href="./inventario.html">
                            <i class="bi bi-basket2-fill"></i> Inventario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link textMain fw-semibold" href="./cobranza.html">
                            <i class="bi bi-cash-stack"></i> Cobranza
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link textMain fw-semibold" href="./economia.html">
                            <i class="bi bi-cash-coin"></i> Economia
                        </a>
                    </li>
                </ul>
            </div>
            <div class="col-lg-11">
                <ul class="nav nav-tabs nav-tabs-g" id="tabClientes" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link nav-link-g active " id="consultar-tab" data-bs-toggle="tab"
                            data-bs-target="#consultar-tab-pane" type="button" role="tab"
                            aria-controls="consultar-tab-pane" aria-selected="true">Consultar</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link nav-link-g" id="estadisticas-tab" data-bs-toggle="tab"
                            data-bs-target="#estadisticas-tab-pane" type="button" role="tab"
                            aria-controls="estadisticas-tab-pane" aria-selected="false">Estadisticas</button>
                    </li>
                </ul>
                <div class="tab-content p-4 border border-top-0 rounded-bottom " id="tabClientesContent">
                    <div class="tab-pane fade show active" id="consultar-tab-pane" role="tabpanel"
                        aria-labelledby="consultar-tab" tabindex="0">
                        <!-- Deben extraerse datos para llenar los clientes del select-->
                        <nav class="row">
                            <div class="col-lg-10">
                                <input class="form-control me-2 textSecondary fw-semibold" type="search" id="buscarCliente" placeholder="Buscar por nombre" autocomplete="off">
                            </div>
                        </nav>
                        <div class="container-fluid">
                            <hr>
                            <div class="row">
                                <table class="table"><!-- Deben extraerse datos para llenar esta tabla-->
                                    <thead>
                                        <tr>
                                            <th scope="col"> Nombre</th>
                                            <th scope="col"> Celular</th>
                                            <th scope="col"> Direccion</th>
                                            <th scope="col"> Estado</th>
                                            <th scope="col"><i class="bi bi-gear"></i></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaClientes">
                                         <!-- Las filas se generan desde JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!-- Modal para actualizar clientes -->
                        <div class="modal fade" id="modalActualizarCliente" tabindex="-1" aria-labelledby="tituloModalCliente" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title textSecondary fw-semibold" id="tituloModalCliente">
                                            Actualizar cliente
                                        </h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form id="formActualizarCliente">
                                            <input type="hidden" id="idClienteEditar">
                                            <div class="mb-3">
                                                <label for="nombreClienteEditar" class="form-label textSecondary fw-semibold">
                                                    Nombre
                                                </label>
                                                <input type="text" class="form-control textSecondary fw-semibold" id="nombreClienteEditar" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="celularClienteEditar" class="form-label textSecondary fw-semibold">
                                                    Celular
                                                </label>
                                                <input type="tel" class="form-control textSecondary fw-semibold" id="celularClienteEditar" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="direccionClienteEditar" class="form-label textSecondary fw-semibold">
                                                    Direccion
                                                </label>
                                                <input type="text" class="form-control textSecondary fw-semibold" id="direccionClienteEditar" required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="estadoClienteEditar" class="form-label textSecondary fw-semibold">
                                                    Estado
                                                </label>
                                                <select id="estadoClienteEditar" class="form-select textSecondary fw-semibold" required>
                                                    <option value="AC">Activo</option>
                                                    <option value="IN">Inactivo</option>
                                                </select>
                                            </div>
                                            <div class="d-flex justify-content-end gap-2">
                                                <button type="button" class="btn btn-outline-secondary fw-semibold" data-bs-dismiss="modal">
                                                    Cancelar
                                                </button>
                                            
                                                <button type="submit" class="btn btn-secondary textMain fw-semibold btnGeneric">
                                                    <i class="bi bi-check-circle"></i>
                                                    Guardar cambios
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade " id="estadisticas-tab-pane" role="tabpanel"
                        aria-labelledby="estadisticas-tab" tabindex="0">
                        <div class="col-sm-3">
                            <label for="anioEstClientes" class="form-label textSecondary fw-semibold">
                                Año
                            </label>
                            <select id="anioEstClientes" class="form-select textSecondary fw-semibold">

                            </select>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead id="encabezadoEstClientes">
                                        <!-- Encabezados generados con JavaScript -->
                                    </thead>
                                    <tbody id="tablaEstClientes">
                                        <!-- Datos generados con JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <hr>
                        <div id="estClientes"></div>
                    </div>
                </div>
            </div>
        </div>
</body>

</html>
